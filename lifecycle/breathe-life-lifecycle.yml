summary: >-
  This is a terminal lifecycle record, not an API versioning policy. Breathe Life
  never published an API, so there is no version scheme, no deprecation policy,
  no sunset-header support and no SLA to capture. What there IS is a documented
  end-of-life for the company's public surface: acquired by SE2 (an Eldridge
  business) on 2022-03-28, rebranded under Zinnia, site banner changed to "We are
  now part of Zinnia!", and the entire breathelife.com web presence
  decommissioned — the apex now returns an nginx "Site Not Configured" 404 and
  www returns a WP Engine "Site is not available" 404 whose payload was last
  modified 2022-04-18. The product capability survives commercially inside
  Zinnia's "Hybrid Origination" line, which is a different legal entity and is
  not profiled here.
