  corporateStatus:
    acquired: true
    acquirer: SE2 (an Eldridge business), subsequently rebranded Zinnia
    announced: '2022-03-28'
    note: |
      Announced from Topeka, KS and Montreal, QC via Business Wire on 2022-03-28. The
      Breathe Life site later carried a "We are now part of Zinnia!" banner. The domain
      has since been decommissioned entirely. Breathe Life is therefore a historical
      record in this catalog: a real Canadian insurance core-systems vendor whose
      product persists inside Zinnia's Hybrid Origination line.
  regulatoryContext: |
    Canada has the most fragmented insurance supervision of the four markets studied:
    OSFI supervises federally-regulated insurers prudentially while the provinces own
    market conduct — FSRA in Ontario, AMF in Quebec. Breathe Life was a technology
    vendor, not a licensed insurer or intermediary, so it sat outside both regimes
    directly and inherited its obligations through its carrier clients' contracts (which
    is why PCI DSS, SOC 2 Type II and SOC 3 were the attestations it published). There
    is no open-insurance mandate in Canada, and Consumer-Driven Banking — the country's
    open-banking framework — excludes insurance entirely, so no forcing function ever
    required Breathe Life or its carrier clients to expose quote, bind, issue or FNOL
    as a public API.
