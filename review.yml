    Insurance) and Glenn Hymers (President & CEO, FaithLife Financial).
- url: https://web.archive.org/web/20220519024512/https://www.breathelife.com/se2-acquires-breathe-life-to-scale-saas-product-and-data-capabilities-for-carriers-across-the-insurance-lifecycle/
  type: PressRelease
  note: |
    "TOPEKA, KS, and MONTREAL, QC [March 28, 2022] (Business Wire) - SE2, an Eldridge
    business and leading life and annuity insurance technology and services company,
    today announced the strategic acquisition of Breathe Life, a new business hybrid
    distribution and digital engagement platform provider for the life insurance
    industry." Also states Breathe Life launched in 2018, names CEO Ian Jeffrey, and
    lists investors Diagram Ventures, Real Ventures, Invest Quebec and angels from AXA,
    AIG and RGA.
- url: https://web.archive.org/web/20210226043449/https://www.breathelife.com/about-us/
  type: About
  note: |
    "Breathe Life is helping the life insurance industry transform with a modern
