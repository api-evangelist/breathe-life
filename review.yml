    note: No .proto file published in the getbreathelife GitHub organization.
  openSource:
    githubOrg: https://github.com/getbreathelife
    publicRepos: 18
    note: |
      All 18 public repositories are internal engineering tooling or forks: ESLint and
      Prettier configs, a Cloud Build GitHub App (cloud-build-on-prs, 11 stars), TestCafe
      reporters for Slack and Sentry, forks of rheostat, react-sticky, pdffiller,
      cls-hooked, kamus and nidhogg, and a fork of globalpayments/node-sdk (which is
      Global Payments' SDK, not a Breathe Life one). The only first-party API-adjacent
      work is onespan-sign-node — a Node.js CLIENT library for the third-party OneSpan
      Sign e-signature API (v11.46) — and terraform-provider-onespansign. Both consume
      someone else's API; neither exposes one.
  compliance:
    attestations:
    - PCI DSS compliant service provider (AoC by request to pci@breathelife.com)
    - SOC 2 Type II (report by request to soc2@breathelife.com)
    - SOC 3 (report published)
    note: |
      Sourced from the archived /life-insurance-security/ page (2022-10-04 snapshot).
      Request-gated by email, not self-serve; no trust center portal.
