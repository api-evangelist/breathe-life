aid: breathe-life
name: Breathe Life
review:
  question: Does Breathe Life publish a public, self-serve API surface for quote,
    bind, issue, or FNOL?
  answer: false
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Canada
  tier: core-systems
findings:
  summary: |
    Breathe Life (Montreal, Quebec) publishes NO public API surface of any kind, and
    as of the 2026-07-25 review its primary domain no longer serves a website at all.
    The apex breathelife.com answers on nginx with an HTTP 404 "Site Not Configured"
    page at every probed path — including /developers, /api, /docs, /openapi.json,
    /swagger.json, /graphql and every .well-known probe — and its TLS certificate does
    not match the hostname. www.breathelife.com is a CNAME to breathelife21.wpengine.com
    and returns a WP Engine "Site is not available" HTTP 404 served from Google Cloud
    Storage with a Last-Modified of 2022-04-18. No developer, developers, docs, api,
    apidocs, portal, partners, sandbox, app, secure or my subdomain resolves.

    Breathe Life was a CORE-SYSTEMS vendor, not a carrier or a broker: an enterprise
    SaaS platform sold to life insurers. Founded 2018 in Montreal, it sold the Breathe
    Life Hybrid Origination (Hybrid Distribution) Platform end-to-end or as four
    licensable modules — Quoter, Hybrid e-App, Advisor Tools, Data Dashboards —
    supporting advisor-driven, consumer self-serve, or blended sales of individual life
    products with simple and complex underwriting paths. Named clients: Teachers Life,
    FaithLife Financial, National Bank Insurance, National Catholic Society of
    Foresters, La Capitale. It raised CAD $11.5M in August 2020 (Diagram Ventures, Real
    Ventures, Investissement Quebec, plus angels from AXA, AIG and RGA), was named to
    the 2020 InsurTech 100, and published PCI DSS service-provider, SOC 2 Type II and
    SOC 3 attestations (AoC and SOC 2 report available only by emailing
    pci@breathelife.com and soc2@breathelife.com — request-gated, not self-serve).

    SE2, an Eldridge business headquartered in Topeka, Kansas, announced the acquisition
    of Breathe Life on 2022-03-28; Breathe Life CEO Ian Jeffrey took over new business
    and customer engagement SaaS products at SE2. SE2 subsequently rebranded as Zinnia,
    and the last substantive capture of the site (2022-10-05) carries a "We are now part
    of Zinnia!" banner. The platform survives inside Zinnia's product line as its
    "Hybrid Origination" solution. Zinnia — a different legal entity, not profiled here —
    does operate a live Kong-hosted developer portal at https://developers.zinnia.com/
    (HTTP 200, listing Case Management, Documents, Illustration, MarketConnect Order
    Entry, New Business, New Business Annuity, Policy and Policy Transactions APIs).
    That portal is Zinnia's, not Breathe Life's, and none of its listed APIs is branded
    or documented as a Breathe Life API.

    This is the expected and correct outcome for a Canadian insurance core-systems
    vendor. Canada has the most fragmented insurance supervision of the four markets
    studied — OSFI prudential, provinces (FSRA, AMF) on market conduct — there is no
    open-insurance mandate, and Consumer-Driven Banking excludes insurance entirely.
    Nothing obliged Breathe Life to publish an API, and its buyers were carriers signing
    enterprise SaaS contracts, not developers signing up self-serve.
