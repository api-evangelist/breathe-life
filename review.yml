    searchedFor:
    - ACORD
    - AL3
    - ACORD XML
    - ACORD certified
    - NGDS
    - IVANS
    - agency download
    - Applied Epic
    - Vertafore AMS360
    note: |
      No occurrence of ACORD, AL3, ACORD XML, NGDS, IVANS, Applied Epic or Vertafore
      appears in the archived Wayback URL index for breathelife.com, in the full text of
      the archived About Us, Hybrid Distribution Platform, Security, Client Success,
      Direct Experience, Distribution or Press pages, in the getbreathelife GitHub
      organization, or in any published npm package. Breathe Life sold a front-end
      origination platform directly to carriers; it was not an agency-management-system
      participant and did not ride the ACORD/IVANS download rail that carries US and
      Canadian broker data. Absence here is a real finding, not a gap in the search.
  insuranceVerbs:
    quote:
      exposed: false
      channel: |
        Real product capability — the "Quoter" module — but delivered inside the
        carrier-licensed, login-gated SaaS application. Advisor-facing and
        consumer-facing depending on the carrier's configuration. No API.
    bind:
      exposed: false
      channel: |
        Delivered through the "Hybrid e-App" module (electronic application capture with
        underwriting rules, simple and complex paths). Advisor-facing or consumer
        self-serve. No API.
    issue:
      exposed: false
      channel: |
        Policy delivery was a stated platform outcome ("increases the speed of policy
        delivery"), executed inside the platform and the carrier's own back office. No API.
    fnol:
      exposed: false
      channel: |
        Not in scope for Breathe Life at all. The platform covered new-business
        origination and distribution only — needs analysis through application — not
        claims. No FNOL surface of any kind.
    note: |
      All four verbs are absent as addressable APIs. Three of them (quote, bind, issue)
      existed as product capability behind an enterprise login; FNOL was never part of
      the product.
  auth:
    model: none published
    note: |
      No API key program, no OAuth2 client-credentials or authorization-code flow, no
      mTLS partner onboarding and no SAML partner SSO is documented anywhere. Neither
      /.well-known/openid-configuration nor /.well-known/oauth-authorization-server is
      served on the apex or www. Platform authentication was carrier-tenant login inside
      the SaaS application and was never documented publicly.
  webhooks:
    exists: false
    note: No event catalog, no AsyncAPI, no webhook documentation, ever published.
  postman:
    exists: false
    note: No public Postman collection or workspace found.
  graphql:
    exists: false
    note: http://breathelife.com/graphql returns 404; no host resolves to introspect.
  grpc:
