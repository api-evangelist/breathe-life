    Hybrid Origination Platform page. Describes the modular model (Quoter, Advisor Tools,
    Hybrid E-App, Data Dashboards), multi-product and multi-insured support, simple and
    complex underwriting capabilities, and carries the Teachers Life client quote. Zero
    mention of an API, an integration catalog, or ACORD.
- url: https://web.archive.org/web/20221004232457/https://www.breathelife.com/life-insurance-security/
