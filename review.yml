- url: https://web.archive.org/web/20220809141908/https://www.breathelife.com/press/
  type: Press
  note: |
    Press index carrying the "Breathe Life has been acquired by SE2" banner and the
    funding trail — CAD $11.5M announced 2020-08-26 — plus carrier wins (Teachers Life
    2021-03-16, National Catholic Society of Foresters 2021-06, an unnamed North American
    carrier 2020-10-20).
- url: https://github.com/getbreathelife
  type: GitHubOrganization
  note: |
    18 public repositories, all internal tooling or forks. Used to confirm no product
    SDK, OpenAPI, Swagger or .proto was ever open-sourced.
- url: https://developers.zinnia.com/
  type: Documentation
  note: |
    ACQUIRER context only. Zinnia's live Kong-hosted developer portal, which is where the
    Breathe Life origination capability now lives commercially (Zinnia markets it as
    "Hybrid Origination"). No listed API carries the Breathe Life name.
actions:
  openapiHarvested: false
  openapiDirectoryOmitted: true
  apisEmpty: true
  reason: |
    apis[] is intentionally empty. Breathe Life never published a documented public API,
    and its domain no longer serves a site, so listing one would be fabrication. This
    record's value is the accurate negative: a Canadian life-insurance core-systems
    vendor whose entire quote / e-app / advisor-tools surface was enterprise SaaS behind
    a carrier login, with no ACORD footprint, no developer portal, no spec, and no
    open-banking or open-insurance mandate anywhere in its home market to force one.
