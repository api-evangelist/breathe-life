  Breathe Life published no client SDK for its own platform, because it never
  exposed a public API. Every first-party package found in a public registry is
  internal engineering tooling (ESLint/Prettier configs, a cls-hooked fork) or a
  client for somebody ELSE'S API (the OneSpan Sign e-signature service). All npm
  packages are published by the npm user `breathelife` and point back at the
  getbreathelife GitHub organization, so first-party authorship is confirmed —
  but none of them is a Breathe Life API SDK, so no `SDKs` pointer is emitted in
  apis.yml. The npm packages have not been republished since 2022-08-16; the
  Terraform provider's last release was 2022-10-28, seven months after the SE2
  acquisition.
