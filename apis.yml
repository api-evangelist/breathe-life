name: Breathe Life
kind: company
description: >-
  Breathe Life is a Montreal, Quebec based life insurance technology company —
  an enterprise SaaS core-systems vendor rather than a carrier or a broker —
  founded in 2018 to sell life insurers a modern new-business origination and
  distribution platform. Its product was the Breathe Life Hybrid Origination
  (Hybrid Distribution) Platform, sold either end-to-end or as four separately
  licensable modules: Quoter, Hybrid e-App, Advisor Tools and Data Dashboards,
  supporting advisor-driven, consumer self-serve, or blended selling of
  individual life products with simple and complex underwriting paths. Its home
  market is Canada, and its named clients were Canadian and North American life
  carriers, fraternals and faith-based insurers including Teachers Life,
  FaithLife Financial, National Bank Insurance, National Catholic Society of
  Foresters and La Capitale. The company raised CAD $11.5M in August 2020 from
  Diagram Ventures, Real Ventures and Investissement Quebec plus angels from
  AXA, AIG and RGA, was named to the 2020 InsurTech 100, and held PCI DSS, SOC 2
  Type II and SOC 3 attestations. SE2, an Eldridge business, announced its
  acquisition of Breathe Life on 2022-03-28; SE2 subsequently rebranded as
  Zinnia, and the Breathe Life site carried a "We are now part of Zinnia!"
  banner before being decommissioned. Its API posture is closed and now
  historical: as of the 2026-07-25 review Breathe Life never published a
  developer portal, API reference, OpenAPI or Swagger definition, Postman
  collection, GraphQL endpoint, webhook catalog or ACORD/AL3 conformance claim
  on breathelife.com, and the domain no longer serves a site at all —
  breathelife.com returns an nginx "Site Not Configured" 404 and
  www.breathelife.com returns a WP Engine "Site is not available" 404. Quote,
  bind, issue and FNOL existed only as capabilities inside a carrier-licensed,
  login-gated SaaS product, never as an addressable public API.
