  name: Lifecycle record
  description: >-
    Terminal lifecycle record: no API versioning or deprecation policy ever
    existed; the SE2 acquisition (2022-03-28), the decommissioning of
    breathelife.com, the deleted Atlassian status page, and the full company
    timeline.
