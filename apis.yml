common:
- type: DomainSecurity
  url: security/breathe-life-domain-security.yml
  name: Domain security probe
  description: >-
    Live TLS/HSTS/DNSSEC/CAA/SPF/DMARC probe of the surviving breathelife.com DNS
    records (2026-07-25). Both reachable hosts present a certificate that does not
    match the hostname.
- type: Packages
  url: packages/breathe-life-packages.yml
  name: Published packages
  description: >-
    Six first-party npm packages and one Terraform Registry provider, all
    published by the breathelife npm account / getbreathelife GitHub org. Every
    one is internal engineering tooling (ESLint/Prettier configs, a cls-hooked
    fork) or a client for a third-party API (OneSpan Sign). No SDK for a Breathe
    Life API exists, so no SDKs pointer is emitted.
- type: Conformance
  url: conformance/breathe-life-conformance.yml
  name: Standards conformance
  description: >-
    Historical PCI DSS service-provider, SOC 2 Type II and SOC 3 attestations
    (archived Security page, request-gated by email) plus API-standard
    conformance — OpenAPI, AsyncAPI, OAuth2, OIDC, RFC 9457, RFC 9116 and ACORD
    all false by absence.
- type: Lifecycle
